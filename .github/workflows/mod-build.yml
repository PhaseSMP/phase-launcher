name: mod-build
on:
  push:
    branches: [mod]
    paths: ['mod/**', '.github/workflows/mod-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: mod-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon build -x test 2>&1 | tee ../build.log || echo BUILD_FAILED >> ../build.log
      - name: Client game test (screenshots)
        if: hashFiles('mod/src/gametest/**') != ''
        working-directory: mod
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew --no-daemon runClientGameTest 2>&1 | tail -200 > ../gametest.log || true
      - name: Dump gametest API
        run: |
          set +e
          FA=$(find ~/.gradle -name 'fabric-client-gametest-api*.jar' -not -name '*sources*' | head -1)
          echo "$FA" > gametest-api.txt
          for c in $(unzip -l "$FA" | awk '{print $4}' | grep 'api/client/gametest/v1/.*\.class$' | sed 's/\.class$//'); do javap -cp "$FA" -public "${c//\//.}" >> gametest-api.txt 2>/dev/null; done
      - name: Publish result
        run: |
          set +e
          rm -rf ci && mkdir -p ci/screenshots
          cp build.log gametest.log gametest-api.txt ci/ 2>/dev/null
          JAR=$(ls mod/build/libs/*.jar 2>/dev/null | grep -v sources | head -1)
          [ -n "$JAR" ] && cp "$JAR" ci/phase-cosmetics.jar
          find mod -path '*screenshots*' -name '*.png' -exec cp {} ci/screenshots/ \; 2>/dev/null
          git config user.name "phase-ci"; git config user.email "ci@phase.local"
          git add -A ci && git commit -qm "CI: сборка мода [skip ci]" && git pull -q --rebase && git push -q

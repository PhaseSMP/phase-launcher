name: worldgen-build
on:
  push:
    branches: [mod]
    paths: ['worldgen/**', '.github/workflows/worldgen-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: worldgen-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Build
        working-directory: worldgen
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6; do ./gradlew --no-daemon --version >/dev/null 2>&1 && break; echo "Gradle retry $i"; sleep 20; done
          set -o pipefail
          ./gradlew --no-daemon build -x test 2>&1 | tee ../worldgen-build.log || echo BUILD_FAILED >> ../worldgen-build.log
      - name: Fetch integrated mods
        continue-on-error: true
        working-directory: worldgen
        run: |
          mkdir -p run/mods
          python3 tools/fetch_mods.py run/mods > ../fetch-mods.log 2>&1 || echo FETCH_FAILED >> ../fetch-mods.log
          cp run/mod-index.txt ../mod-index.txt 2>/dev/null || true
          cp run/mod-dump.zip ../mod-dump.zip 2>/dev/null || true
      - name: Server self-test (generates part of the map, profiled)
        if: hashFiles('worldgen/build/libs/*.jar') != ''
        timeout-minutes: 25
        continue-on-error: true
        working-directory: worldgen
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=20261124\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\n" > run/server.properties
          timeout 1300 ./gradlew --no-daemon runServer -Pprofile=true > ../worldgen-server-full.log 2>&1
          grep -E "\[selftest\]|ERROR|Exception|Caused by|Failed to|Couldn't|Mixin|Loading [0-9]+ mods|^\s+- " ../worldgen-server-full.log | head -500 > ../worldgen-server.log
          tail -150 ../worldgen-server-full.log >> ../worldgen-server.log
          if [ -f run/worldgen.jfr ]; then
            jfr print --events jdk.ExecutionSample --stack-depth 64 run/worldgen.jfr > ../samples.txt 2>/dev/null
            python3 tools/jfr_top.py ../samples.txt > ../worldgen-profile.txt
          fi
      - name: Client screenshots
        # off by default (slow); run the workflow by hand with shots=true to get them
        if: github.event_name == 'workflow_dispatch' && hashFiles('worldgen/build/libs/*.jar') != ''
        timeout-minutes: 85
        continue-on-error: true
        working-directory: worldgen
        run: |
          set +e
          (sudo apt-get update -qq; for p in xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libvulkan1 vulkan-tools; do sudo apt-get install -y -qq $p || echo "no package $p"; done) > ../apt.log 2>&1
          LIBGL_ALWAYS_SOFTWARE=1 timeout 4800 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew --no-daemon runClientGameTest > ../shots-full.log 2>&1
          grep -E "\[shots\]|ERROR|Exception|Caused by" ../shots-full.log | head -300 > ../worldgen-shots.log
          tail -120 ../shots-full.log >> ../worldgen-shots.log
      - name: Publish result
        if: always()
        run: |
          set +e
          rm -rf ci-worldgen && mkdir -p ci-worldgen/screenshots
          cp worldgen-build.log worldgen-server.log worldgen-profile.txt worldgen-shots.log mod-index.txt mod-dump.zip fetch-mods.log ci-worldgen/ 2>/dev/null
          JAR=$(ls worldgen/build/libs/*.jar 2>/dev/null | grep -v sources | head -1)
          [ -n "$JAR" ] && cp "$JAR" ci-worldgen/phase-world.jar
          find worldgen -path '*screenshots*' -name '*.png' -exec cp {} ci-worldgen/screenshots/ \; 2>/dev/null
          git config user.name "phase-ci"; git config user.email "ci@phase.local"
          git add -A ci-worldgen && git commit -qm "CI: Phase World [skip ci]" && git pull -q --rebase && git push -q

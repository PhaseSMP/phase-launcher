name: worldgen-build
on:
  push:
    branches: [mod]
    paths: ['worldgen/**', '.github/workflows/worldgen-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: worldgen-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Build
        working-directory: worldgen
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6; do ./gradlew --no-daemon --version >/dev/null 2>&1 && break; echo "Gradle retry $i"; sleep 20; done
          set -o pipefail
          ./gradlew --no-daemon build -x test 2>&1 | tee ../worldgen-build.log || echo BUILD_FAILED >> ../worldgen-build.log
      - name: Server self-test (generates part of the map)
        if: hashFiles('worldgen/build/libs/*.jar') != ''
        timeout-minutes: 25
        continue-on-error: true
        working-directory: worldgen
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=20261124\nonline-mode=false\nspawn-protection=0\n" > run/server.properties
          timeout 1300 ./gradlew --no-daemon runServer > ../worldgen-server-full.log 2>&1
          grep -E "\[selftest\]|ERROR|Exception|Caused by|Failed to|Couldn't" ../worldgen-server-full.log | head -400 > ../worldgen-server.log
          tail -150 ../worldgen-server-full.log >> ../worldgen-server.log
      - name: Publish result
        if: always()
        run: |
          set +e
          rm -rf ci-worldgen && mkdir -p ci-worldgen
          cp worldgen-build.log worldgen-server.log ci-worldgen/ 2>/dev/null
          JAR=$(ls worldgen/build/libs/*.jar 2>/dev/null | grep -v sources | head -1)
          [ -n "$JAR" ] && cp "$JAR" ci-worldgen/phase-world.jar
          git config user.name "phase-ci"; git config user.email "ci@phase.local"
          git add -A ci-worldgen && git commit -qm "CI: Phase World [skip ci]" && git pull -q --rebase && git push -q

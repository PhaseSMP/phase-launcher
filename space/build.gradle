plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Iris/Sodium are NOT compile dependencies: the shader integration talks to the Iris API by reflection (ShaderCompat)
}
processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

loom {
	runs {
		// CI smoke test: loads space and every planet world, generates part of the asteroid belt, logs and stops (SelfTest.java)
		server {
			vmArg "-Dphasespace.selftest=true"
			vmArg "-Xmx3G"
		}
	}
}

// textures, models and datapack JSON are generated by tools/gen_assets.py (committed; the build does not run Python)

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "phasespace-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
